# ms-swift SFT example
model: <MODEL_PATH>
train_type: full
dataset: <SFT_DIR>/swift_train.jsonl
val_dataset: <SFT_DIR>/swift_val.jsonl
max_length: 32768          # or 131072
num_train_epochs: 2
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 1e-5
lr_scheduler_type: cosine
warmup_ratio: 0.03
bf16: true
gradient_checkpointing: true
output_dir: <OUTPUT_DIR>
